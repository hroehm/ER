<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tesla Mainframe - Q3.5 (Debrief)</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 40px; text-align: center; }
        .hidden { display: none; }
        h1 { color: #e82127; letter-spacing: 2px; text-transform: uppercase; } /* Tesla Red */
        input[type="text"] { padding: 10px; font-size: 18px; border: 1px solid #555; background: #111; color: #fff; width: 300px; margin-bottom: 20px; }
        button { background: #e82127; color: #fff; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;}
        button:hover { background: #ff3333; }
        #canvasContainer { margin-top: 30px; display: none; }
        canvas { border: 1px solid #333; max-width: 100%; box-shadow: 0px 0px 20px rgba(232, 33, 39, 0.2); }
    </style>
</head>
<body>
    
    <div id="authScreen">
        <h1>AUTONOMOUS SECURE OVERRIDE</h1>
        <p style="color:#888;">Enter final Time Token from Q3.4 to lock in your score:</p>
        <input type="text" id="tknInput" placeholder="TKN-XX">
        <br>
        <button onclick="startDebrief()">SUBMIT LOGS</button>
    </div>

    <div id="debriefScreen" class="hidden">
        <h1>THREAT ERADICATED</h1>
        <p style="font-size: 18px;">The autonomous driving grid has been secured.<br>Total Incident Response Time: <strong id="finalTime" style="color:#e82127;">00:00</strong></p>
        
        <p>Enter your Operator Name to generate your official clearance certificate:</p>
        <input type="text" id="studentName" placeholder="Jane Doe" autocomplete="off">
        <br>
        <button onclick="generateCertificate()">GENERATE & DOWNLOAD CERTIFICATE</button>
    </div>

    <div id="canvasContainer">
        <canvas id="certCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        let finalSeconds = 0;
        let formattedTime = "00:00";

        function startDebrief() {
            let tkn = document.getElementById('tknInput').value.trim().toUpperCase();
            if(tkn.startsWith('TKN-')) {
                finalSeconds = parseInt(tkn.split('-')[1]) || 0;
                let m = Math.floor(finalSeconds / 60).toString().padStart(2, '0');
                let s = (finalSeconds % 60).toString().padStart(2, '0');
                formattedTime = m + ':' + s;
                
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('debriefScreen').classList.remove('hidden');
                document.getElementById('finalTime').innerText = formattedTime;
            } else {
                alert("Invalid Final Token.");
            }
        }

        function generateCertificate() {
            const name = document.getElementById('studentName').value.trim();
            if(!name) { alert("Please enter your name."); return; }

            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Border
            ctx.strokeStyle = "#e82127";
            ctx.lineWidth = 5;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            // Logo Text (Faux Tesla)
            ctx.fillStyle = "#e82127";
            ctx.font = "bold 50px Arial";
            ctx.textAlign = "center";
            ctx.fillText("T E S L A", canvas.width / 2, 100);

            // Subtitle
            ctx.fillStyle = "#888888";
            ctx.font = "20px Arial";
            ctx.letterSpacing = "2px";
            ctx.fillText("AUTONOMOUS DRIVE - CYBERSECURITY TEAM", canvas.width / 2, 140);

            // Title
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 36px Arial";
            ctx.fillText("CERTIFICATE OF INCIDENT RESPONSE", canvas.width / 2, 250);

            ctx.fillStyle = "#aaaaaa";
            ctx.font = "italic 20px Arial";
            ctx.fillText("This certifies that", canvas.width / 2, 310);

            // Student Name (NO UNDERLINE per strict instructions)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 40px Arial";
            ctx.fillText(name, canvas.width / 2, 370);

            // Description
            ctx.fillStyle = "#aaaaaa";
            ctx.font = "18px Arial";
            ctx.fillText("successfully neutralized an active Advanced Persistent Threat (APT)", canvas.width / 2, 430);
            ctx.fillText("and secured the autonomous vehicle grid.", canvas.width / 2, 460);

            // Time Score
            ctx.fillStyle = "#e82127";
            ctx.font = "bold 24px Arial";
            ctx.fillText(`TOTAL ELAPSED TIME: ${formattedTime}`, canvas.width / 2, 530);

            // Trigger Download
            const link = document.createElement('a');
            link.download = `Incident_Response_Cert_${name.replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            // Show canvas to user as proof
            document.getElementById('canvasContainer').style.display = "block";
        }
    </script>
</body>
</html>
